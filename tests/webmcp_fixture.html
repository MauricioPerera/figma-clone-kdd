<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>WebMCP KDD — fixture aislado</title>
<style>html,body{margin:0;height:100%;background:#202124;color:white;font:16px system-ui}body{display:flex;flex-direction:column}header{padding:12px;background:#503519}main{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}#status{float:right}</style></head>
<body><header>PRUEBA AISLADA · No lee ni escribe proyectos guardados <span id="status">Cargando…</span></header>
<main><canvas id="canvas"></canvas></main>
<script type="module">
import {StateStore} from '../src/engine/state.js';
import {CanvasEngine} from '../src/engine/canvas.js';
import {registerFigmaWebMcpTools} from '../src/mcp/webmcp_tools.js?v=tool-audit-2';
// Overrides are confined to this test fixture. No localStorage/IndexedDB access.
class MemoryStore extends StateStore {
  saveToStorage(){this.persistenceStatus={status:'memory-only',backend:'test-fixture'};}
  async flushPersistence(){this.saveToStorage();return this.persistenceStatus;}
}
const store=new MemoryStore({title:'Fixture aislado WebMCP',layers:[
  {id:'fixture-rect',type:'rect',name:'Rectángulo de prueba',x:50,y:60,width:320,height:180,fill:'#6366f1',visible:true,opacity:1},
  {id:'fixture-text',type:'text',name:'Texto de prueba',text:'WebMCP · fixture aislado',x:70,y:110,width:280,height:50,fontSize:20,fontFamily:'sans-serif',fontWeight:'400',fill:'#ffffff',visible:true,opacity:1}
],viewport:{panX:80,panY:60,zoom:1}});
await store.ready;
const engine=new CanvasEngine(document.getElementById('canvas'),store);
const registry=registerFigmaWebMcpTools(store,engine);
const status=document.getElementById('status');
const update=()=>status.textContent=`${registry.getRegisteredTools().length} herramientas · ${store.state.layers.length} capas · ${store.state.designContract?'protegido':'sin protección'}`;
store.subscribe(update);update();
</script></body></html>
